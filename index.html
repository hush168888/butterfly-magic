<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>灵动微光 - 手势蝴蝶交互</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands CDN (Native getUserMedia used for camera management) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Container handling safe area insets for notches & dynamic island */
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    video#webcam {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Default mirrored for front camera */
      z-index: 1;
      transition: transform 0.3s ease-in-out;
    }

    canvas#webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Glassmorphism UI elements */
    .glass-panel {
      background: rgba(18, 22, 31, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
    }

    .glass-btn:active {
      transform: translateY(0) scale(0.96);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Header safe area adjustments */
    .safe-top-padding {
      top: max(1.25rem, env(safe-area-inset-top));
      left: max(1rem, env(safe-area-inset-left));
      right: max(1rem, env(safe-area-inset-right));
    }

    .safe-bottom-padding {
      bottom: max(1.5rem, env(safe-area-inset-bottom));
    }

    /* Flip icon animation */
    .flip-icon {
      transition: transform 0.4s ease;
    }
    .rotating {
      transform: rotate(180deg);
    }

    /* Subtle pulse glow animation */
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .pulse-glow {
      animation: subtlePulse 3s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <div id="container">
    <!-- Camera Video Element -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Three.js Overlay Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- UI Overlay Header -->
    <div class="absolute safe-top-padding z-10 flex justify-between items-center pointer-events-none">
      <!-- App Title Badge -->
      <div class="glass-panel px-4 py-2.5 sm:px-5 sm:py-3 rounded-2xl flex items-center space-x-2.5 sm:space-x-3 pointer-events-auto shadow-lg">

        <h1 id="ui-app-title" class="text-white text-xs sm:text-base font-medium tracking-wide">灵动蝴蝶 <span class="text-[10px] sm:text-xs opacity-60 font-light ml-1">v2.1</span></h1>
      </div>

      <!-- Header Action Controls -->
      <div class="flex items-center space-x-2 sm:space-x-3 pointer-events-auto">
        <!-- Language Switch Button -->
        <button id="btn-lang" class="glass-btn text-white px-3 sm:px-4 rounded-2xl text-xs font-medium shadow-lg space-x-1.5 focus:outline-none" title="Switch Language / 切换语言">
          <i class="fas fa-globe text-pink-300 text-sm"></i>
          <span id="lang-btn-text">English</span>
        </button>

        <!-- Camera Switch Button (Front / Rear) -->
        <button id="btn-camera" class="glass-btn text-white w-11 h-11 rounded-2xl text-sm shadow-lg focus:outline-none" title="Switch Camera / 切换摄像头">

        </button>

        <!-- Audio Toggle Button -->
        <button id="btn-audio" class="glass-btn text-white w-11 h-11 rounded-2xl text-sm shadow-lg focus:outline-none" title="Toggle Sound / 音效开关">
          <i id="audio-icon" class="fas fa-volume-up"></i>
        </button>

        <!-- Help Modal Button -->
        <button id="btn-help" class="glass-btn text-white w-11 h-11 rounded-2xl text-sm shadow-lg focus:outline-none" title="Help Guide / 使用指南">
          <i class="fas fa-question"></i>
        </button>
      </div>
    </div>

    <!-- Gesture Status Indicator Badge -->
    <div id="gesture-indicator" class="absolute safe-bottom-padding left-1/2 transform -translate-x-1/2 z-10 pointer-events-none w-11/12 max-w-md">

            <i class="fas fa-hand-holding text-emerald-400 mt-0.5 text-sm flex-shrink-0"></i>
            <span><strong id="help-palm-label">摊开手心：</strong><span id="help-palm-text">3~5只蝴蝶被吸引，温柔停落在您的手掌中央憩息。</span></span>

          </li>
          <li class="flex items-start space-x-2.5">
            <i class="fas fa-hand-fist text-blue-400 mt-0.5 text-sm flex-shrink-0"></i>
            <span><strong id="help-fist-label">捏成拳头：</strong><span id="help-fist-text">蝴蝶向拳头周围轻柔靠拢，不遮挡脸部。</span></span>

            <span><strong id="help-open-label">平放/张开：</strong><span id="help-open-text">蝴蝶在全景空间中自然飞舞。</span></span>
          </li>
        </ul>
      </div>
    </div>
  </div>

      en: {
        pageTitle: "Glimmer Flutter - Interactive Butterfly Experience",
        appTitle: 'Glimmer Flutter <span class="text-[10px] sm:text-xs opacity-60 font-light ml-1">v2.1</span>',
        langBtnText: "中文",
        startTitle: "Interactive Butterfly Experience",
        startDesc: "Enable your camera to begin. Gestures are processed locally in real time as butterflies flutter and land softly with your movements.",
        guidePalmLabel: "Open Palm: ",
        guidePalmText: "3–5 butterflies hover and gently land in your palm to rest.",
        guidePointLabel: "Point Index: ",
        guidePointText: "A single butterfly perches gracefully on your fingertip.",
        guideFistLabel: "Clench Fist: ",

        guideOpenLabel: "Open Hand: ",

        startBtn: "Enable Camera & Start",
        helpTitle: "Gesture Interaction Guide",

        helpPointLabel: "Point Index: ",
        helpPointText: "Attracts 1 butterfly to perch precisely on your index fingertip.",
        helpFistLabel: "Clench Fist: ",
        helpFistText: "Gathers butterflies softly around your fist without blocking your face.",
        helpOpenLabel: "Open Hand: ",
        helpOpenText: "Butterflies glide naturally across the full scene.",
        statusWaiting: "Waiting to start camera & gesture tracking...",
        statusSwitchingCam: "Switching camera...",
        statusNoHand: "Show your hand to interact with the butterflies",
        statusPalm: "Open Palm: Butterflies resting gently in your hand",
        statusPoint: "Pointing: Butterfly perching on your index fingertip",
        statusFist: "Clenched Fist: Butterflies swirling around your hand",
        statusOpen: "Open Hand: Butterflies fluttering freely"
      }
    };

    // Native Camera Stream & MediaPipe State
    let currentStream = null;
    let frameAnimId = null;
    let isProcessingFrame = false;
    let hands = null;
    
    // Three.js Scene Variables
    let scene, threeCamera, renderer;
    let butterflies = [];
    let handLandmarks = null;
    let currentGesture = 'NONE'; // 'PALM_OPEN', 'POINTING', 'FIST', 'OPEN', 'NONE'
    
    // Language & Camera states
    let currentLang = 'en';
    let currentFacingMode = 'user'; // 'user' (front) or 'environment' (rear)
    let isCameraActive = false;
    let isSwitchingCamera = false;

    // Perched butterfly references
    let landedFingerButterfly = null;
    let landedPalmButterflies = [];

    // Target tracking vectors
    let targetFingerPos = new THREE.Vector3();
    let handCenterPos = new THREE.Vector3();

    let isAudioMuted = false;
    let audioCtx = null;

    function detectDefaultLanguage() {
      const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (userLang.startsWith('zh')) {
        return 'zh';
      }
      return 'en';
    }

    function applyLanguage(lang) {
      currentLang = translations[lang] ? lang : 'en';
      const t = translations[currentLang];

      document.title = t.pageTitle;
      document.getElementById('ui-app-title').innerHTML = t.appTitle;
      document.getElementById('lang-btn-text').innerText = t.langBtnText;

      document.getElementById('modal-start-title').innerText = t.startTitle;
      document.getElementById('modal-start-desc').innerText = t.startDesc;
      document.getElementById('guide-palm-label').innerText = t.guidePalmLabel;
      document.getElementById('guide-palm-text').innerText = t.guidePalmText;
      document.getElementById('guide-point-label').innerText = t.guidePointLabel;
      document.getElementById('guide-point-text').innerText = t.guidePointText;
      document.getElementById('guide-fist-label').innerText = t.guideFistLabel;
      document.getElementById('guide-fist-text').innerText = t.guideFistText;
      document.getElementById('guide-open-label').innerText = t.guideOpenLabel;
      document.getElementById('guide-open-text').innerText = t.guideOpenText;
      document.getElementById('btn-start').innerText = t.startBtn;

      document.getElementById('help-title').innerText = t.helpTitle;
      document.getElementById('help-palm-label').innerText = t.helpPalmLabel;
      document.getElementById('help-palm-text').innerText = t.helpPalmText;
      document.getElementById('help-point-label').innerText = t.helpPointLabel;
      document.getElementById('help-point-text').innerText = t.helpPointText;
      document.getElementById('help-fist-label').innerText = t.helpFistLabel;
      document.getElementById('help-fist-text').innerText = t.helpFistText;
      document.getElementById('help-open-label').innerText = t.helpOpenLabel;
      document.getElementById('help-open-text').innerText = t.helpOpenText;

      refreshGestureText();
    }

    function toggleLanguage() {
      const nextLang = currentLang === 'zh' ? 'en' : 'zh';
      applyLanguage(nextLang);
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playLandingSound(count = 1) {
      if (isAudioMuted || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const baseNotes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      const numNotes = count > 1 ? 5 : 4;

      for (let i = 0; i < numNotes; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseNotes[i % baseNotes.length], now + i * 0.06);

        gain.gain.setValueAtTime(0.05, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + i * 0.06);
        osc.stop(now + i * 0.06 + 0.35);
      }
    }

    function playGestureSound(type) {
      if (isAudioMuted || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      const baseFreq = type === 'PALM_OPEN' ? 520 : (type === 'FIST' ? 220 : (type === 'POINTING' ? 440 : 330));
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.25, now + 0.2);

      gain.gain.setValueAtTime(0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.22);
    }

    function createSketchButterfly(colorHex) {
      const group = new THREE.Group();

      const strokeColor = new THREE.Color(colorHex);
      const strokeMaterial = new THREE.LineBasicMaterial({
        color: strokeColor,
        linewidth: 2,
        transparent: true,
        opacity: 0.95
      });

      const fillMaterial = new THREE.MeshBasicMaterial({
        color: strokeColor,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.38,
        depthWrite: false
      });

      // Wing geometry curves
      const wingCurve = new THREE.CurvePath();
      const c1 = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(-0.6, 0.8, 0.1),
        new THREE.Vector3(-1.3, 0.4, 0.0),
        new THREE.Vector3(-0.8, -0.2, 0)
      );
      const c2 = new THREE.CubicBezierCurve3(
        new THREE.Vector3(-0.8, -0.2, 0),
        new THREE.Vector3(-1.2, -0.9, 0),
        new THREE.Vector3(-0.4, -1.0, 0),
        new THREE.Vector3(0, -0.4, 0)
      );
      wingCurve.add(c1);
      wingCurve.add(c2);

      const wingPoints = wingCurve.getPoints(32);
      const wingGeo = new THREE.BufferGeometry().setFromPoints(wingPoints);
      const wingOutline = new THREE.Line(wingGeo, strokeMaterial);

      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.bezierCurveTo(-0.6, 0.8, -1.3, 0.4, -0.8, -0.2);
      shape.bezierCurveTo(-1.2, -0.9, -0.4, -1.0, 0, -0.4);
      shape.closePath();

      const shapeGeo = new THREE.ShapeGeometry(shape);
      const wingFill = new THREE.Mesh(shapeGeo, fillMaterial);

      const leftWingGroup = new THREE.Group();
      leftWingGroup.add(wingOutline);
      leftWingGroup.add(wingFill);

      const rightWingGroup = new THREE.Group();
      const rightOutline = wingOutline.clone();
      rightOutline.scale.set(-1, 1, 1);
      const rightFill = wingFill.clone();
      rightFill.scale.set(-1, 1, 1);
      rightWingGroup.add(rightOutline);
      rightWingGroup.add(rightFill);

      group.add(leftWingGroup);
      group.add(rightWingGroup);

      // Body & Antennae
      const bodyCurve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0.4, 0),
        new THREE.Vector3(0.03, 0.0, 0),
        new THREE.Vector3(-0.03, -0.4, 0),
        new THREE.Vector3(0, -0.7, 0)
      );
      const bodyGeo = new THREE.BufferGeometry().setFromPoints(bodyCurve.getPoints(16));
      const bodyLine = new THREE.Line(bodyGeo, strokeMaterial);
      group.add(bodyLine);

      const antLeftCurve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0.3, 0),
        new THREE.Vector3(-0.1, 0.6, 0),
        new THREE.Vector3(-0.25, 0.7, 0),
        new THREE.Vector3(-0.35, 0.8, 0)
      );
      const antLeftLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(antLeftCurve.getPoints(12)), strokeMaterial);
      const dotGeo = new THREE.SphereGeometry(0.04, 8, 8);
      const dotMat = new THREE.MeshBasicMaterial({ color: strokeColor });
      const dotLeft = new THREE.Mesh(dotGeo, dotMat);
      dotLeft.position.set(-0.35, 0.8, 0);

      const antRightLine = antLeftLine.clone();
      antRightLine.scale.set(-1, 1, 1);
      const dotRight = dotLeft.clone();
      dotRight.position.set(0.35, 0.8, 0);

      group.add(antLeftLine);
      group.add(dotLeft);
      group.add(antRightLine);
      group.add(dotRight);

      group.userData = {
        leftWing: leftWingGroup,
        rightWing: rightWingGroup,
        flapSpeed: 10 + Math.random() * 8,
        flapPhase: Math.random() * Math.PI * 2,
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 0.02,
          (Math.random() - 0.5) * 0.02,
          (Math.random() - 0.5) * 0.02
        ),
        targetPos: new THREE.Vector3(),
        baseScale: 0.24 + Math.random() * 0.1,
        wanderOffset: new THREE.Vector3(
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 6,
          (Math.random() - 0.5) * 4
        ),
        isPerched: false,
        palmOffset: new THREE.Vector3()
      };

      group.scale.setScalar(group.userData.baseScale);
      return group;
    }

    function initThreeScene() {
      const canvas = document.getElementById('webgl-canvas');
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();

      const aspect = window.innerWidth / window.innerHeight;
      threeCamera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
      threeCamera.position.set(0, 0, 10);

      const colors = [0xFF69B4, 0x3A86FF, 0xFFBE0B];
      const butterflyCount = 20;

      for (let i = 0; i < butterflyCount; i++) {
        const color = colors[i % colors.length];
        const b = createSketchButterfly(color);

        b.position.set(
          (Math.random() - 0.5) * 14,
          (Math.random() - 0.5) * 8,
          (Math.random() - 0.5) * 6 - 1
        );

        butterflies.push(b);
        scene.add(b);
      }

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      threeCamera.aspect = width / height;
      threeCamera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function initMediaPipeHands() {
      // Safely close existing instance if present to reset WASM tracking state
      if (hands) {
        try {
          hands.close();
        } catch (err) {
          console.warn('Notice closing previous MediaPipe instance:', err);
        }
        hands = null;
      }

      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65
      });

      hands.onResults(onHandResults);
    }

    async function processVideoFrame() {
      const videoElement = document.getElementById('webcam');
      
      if (isCameraActive && videoElement && videoElement.readyState >= 2 && hands && !isProcessingFrame) {
        isProcessingFrame = true;
        try {
          await hands.send({ image: videoElement });
        } catch (err) {
          console.warn('Frame processing warning:', err);
        } finally {
          isProcessingFrame = false;
        }
      }

      if (isCameraActive) {
        frameAnimId = requestAnimationFrame(processVideoFrame);
      }
    }

    async function startCameraStream(facingMode) {
      const videoElement = document.getElementById('webcam');
      const t = translations[currentLang];

      if (isSwitchingCamera) return;
      isSwitchingCamera = true;

      // Update gesture UI status text
      document.getElementById('gesture-text').innerText = t.statusSwitchingCam;

      // Stop frame processing loop & reset state flag
      isCameraActive = false;
      isProcessingFrame = false;
      if (frameAnimId) {
        cancelAnimationFrame(frameAnimId);
        frameAnimId = null;
      }

      // Explicitly stop and release all current media tracks
      if (currentStream) {
        currentStream.getTracks().forEach(track => {
          track.stop();
        });
        currentStream = null;
      }

      if (videoElement.srcObject) {
        const activeStream = videoElement.srcObject;
        if (activeStream && activeStream.getTracks) {
          activeStream.getTracks().forEach(track => track.stop());
        }
        videoElement.srcObject = null;
      }

      currentFacingMode = facingMode;

      // Mirror video element only for front camera ("user")
      if (currentFacingMode === 'user') {
        videoElement.style.transform = 'scaleX(-1)';
      } else {
        videoElement.style.transform = 'scaleX(1)';
      }

      // Re-initialize a fresh MediaPipe Hands instance for the new camera stream
      initMediaPipeHands();

      try {
        const constraints = {
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        const newStream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = newStream;
        videoElement.srcObject = newStream;

        await new Promise((resolve) => {
          videoElement.onloadedmetadata = () => {
            videoElement.play().then(resolve).catch(resolve);
          };
        });

        isCameraActive = true;
        isProcessingFrame = false;
        processVideoFrame();
      } catch (err) {
        console.warn('Primary camera constraint failed, trying fallback:', err);
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          currentStream = fallbackStream;
          videoElement.srcObject = fallbackStream;
          await videoElement.play();

          isCameraActive = true;
          isProcessingFrame = false;
          processVideoFrame();
        } catch (fallbackErr) {
          console.error('Camera access completely denied or unavailable:', fallbackErr);
          isCameraActive = false;
        }
      } finally {
        isSwitchingCamera = false;
        refreshGestureText();
      }

      // Hide start overlay modal on initial startup
      const startOverlay = document.getElementById('start-overlay');
      if (startOverlay && !startOverlay.classList.contains('hidden')) {
        startOverlay.classList.add('opacity-0');
        setTimeout(() => {
          startOverlay.classList.add('hidden');
        }, 500);
      }
    }

    async function toggleCameraFacing() {
      if (isSwitchingCamera) return;
      const nextFacing = currentFacingMode === 'user' ? 'environment' : 'user';
      const icon = document.getElementById('camera-icon');
      if (icon) icon.classList.toggle('rotating');
      await startCameraStream(nextFacing);
    }

    function videoToWorld(x, y, z = 0) {
      // Mirror horizontal coordinates only when using front camera ('user')
      const normX = currentFacingMode === 'user' ? (1 - x) * 2 - 1 : x * 2 - 1;
      const normY = -(y * 2 - 1);

      const fov = threeCamera.fov * (Math.PI / 180);
      const distance = 10;
      const height = 2 * Math.tan(fov / 2) * distance;
      const width = height * threeCamera.aspect;

      return new THREE.Vector3(
        normX * (width / 2),
        normY * (height / 2),
        -z * 4
      );
    }

    function onHandResults(results) {
      if (results && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handLandmarks = results.multiHandLandmarks[0];

        // 1. Calculate Index Fingertip Position (Landmark 8)
        const indexTip = handLandmarks[8];
        targetFingerPos.copy(videoToWorld(indexTip.x, indexTip.y, indexTip.z));

        // 2. Calculate Palm Center Position
        const p0 = handLandmarks[0];
        const p5 = handLandmarks[5];
        const p9 = handLandmarks[9];
        const p13 = handLandmarks[13];
        const p17 = handLandmarks[17];

        const avgX = (p0.x + p5.x + p9.x + p13.x + p17.x) / 5;
        const avgY = (p0.y + p5.y + p9.y + p13.y + p17.y) / 5;
        const avgZ = (p0.z + p5.z + p9.z + p13.z + p17.z) / 5;

        handCenterPos.copy(videoToWorld(avgX, avgY, avgZ));

        // 3. Classify Gesture
        classifyGesture(handLandmarks);
      } else {
        handLandmarks = null;
        if (currentGesture !== 'NONE') {
          currentGesture = 'NONE';
          updateGestureUI('NONE');
          releaseAllLandedButterflies();
        }
      }
    }

    function classifyGesture(landmarks) {
      const getDist = (pt1, pt2) => Math.hypot(pt1.x - pt2.x, pt1.y - pt2.y, pt1.z - pt2.z);

      // Fold checks for index, middle, ring, pinky
      const indexFold = getDist(landmarks[5], landmarks[8]) < getDist(landmarks[0], landmarks[5]) * 0.6;
      const middleFold = getDist(landmarks[9], landmarks[12]) < getDist(landmarks[0], landmarks[9]) * 0.6;
      const ringFold = getDist(landmarks[13], landmarks[16]) < getDist(landmarks[0], landmarks[13]) * 0.6;
      const pinkyFold = getDist(landmarks[17], landmarks[20]) < getDist(landmarks[0], landmarks[17]) * 0.6;

      let detected = 'OPEN';

      // 1. Index Pointing
      if (!indexFold && middleFold && ringFold && pinkyFold) {
        detected = 'POINTING';
      } 
      // 2. Fist
      else if (indexFold && middleFold && ringFold && pinkyFold) {
        detected = 'FIST';
      } 
      // 3. Open Palm
      else if (!indexFold && !middleFold && !ringFold && !pinkyFold) {
        const fingerSpread = getDist(landmarks[4], landmarks[20]);
        if (fingerSpread > 0.22) {
          detected = 'PALM_OPEN';
        } else {
          detected = 'OPEN';
        }
      } else {
        detected = 'OPEN';
      }

      if (detected !== currentGesture) {
        currentGesture = detected;
        playGestureSound(currentGesture);

        if (currentGesture === 'PALM_OPEN') {
          updateGestureUI('PALM_OPEN');
          assignPalmButterflies();
        } else if (currentGesture === 'POINTING') {
          updateGestureUI('POINTING');
          assignFingerButterfly();
        } else if (currentGesture === 'FIST') {
          updateGestureUI('FIST');
          releaseAllLandedButterflies();
        } else {
          updateGestureUI('OPEN');
          releaseAllLandedButterflies();
        }
      }
    }

    function assignPalmButterflies() {
      releaseAllLandedButterflies();

      const sorted = [...butterflies].sort((a, b) => {
        return a.position.distanceTo(handCenterPos) - b.position.distanceTo(handCenterPos);
      });

      const count = Math.min(4, sorted.length);
      const offsets = [
        new THREE.Vector3(0, 0.1, 0.2),
        new THREE.Vector3(-0.45, -0.1, 0.15),
        new THREE.Vector3(0.45, 0.05, 0.2),
        new THREE.Vector3(-0.15, 0.4, 0.25)
      ];

      for (let i = 0; i < count; i++) {
        const b = sorted[i];
        b.userData.isPerched = true;
        b.userData.palmOffset.copy(offsets[i]);
        landedPalmButterflies.push(b);
      }

      playLandingSound(count);
    }

    function assignFingerButterfly() {
      releaseAllLandedButterflies();

      let minDist = Infinity;
      let closest = null;

      butterflies.forEach(b => {
        const d = b.position.distanceTo(targetFingerPos);
        if (d < minDist) {
          minDist = d;
          closest = b;
        }
      });

      if (closest) {
        landedFingerButterfly = closest;
        landedFingerButterfly.userData.isPerched = true;
        playLandingSound(1);
      }
    }

    function releaseAllLandedButterflies() {
      if (landedFingerButterfly) {
        landedFingerButterfly.userData.isPerched = false;
        landedFingerButterfly = null;
      }
      landedPalmButterflies.forEach(b => {
        b.userData.isPerched = false;
      });
      landedPalmButterflies = [];
    }

    function updateGestureUI(state) {
      const t = translations[currentLang];
      const indicatorText = document.getElementById('gesture-text');
      const indicatorIcon = document.getElementById('gesture-icon');

      if (!indicatorText || !indicatorIcon) return;

      let text = t.statusNoHand;
      if (state === 'PALM_OPEN') {
        text = t.statusPalm;
        indicatorIcon.innerHTML = '<i class="fas fa-hand-holding text-emerald-400 animate-pulse"></i>';
      } else if (state === 'POINTING') {
        text = t.statusPoint;
        indicatorIcon.innerHTML = '<i class="fas fa-hand-pointer text-yellow-400"></i>';
      } else if (state === 'FIST') {
        text = t.statusFist;
        indicatorIcon.innerHTML = '<i class="fas fa-hand-fist text-blue-400"></i>';
      } else if (state === 'OPEN') {
        text = t.statusOpen;
        indicatorIcon.innerHTML = '<i class="fas fa-hand-sparkles text-pink-400"></i>';
      } else {
        indicatorIcon.innerHTML = '<i class="fas fa-video text-gray-400"></i>';
      }

      indicatorText.innerText = text;
    }

    function refreshGestureText() {
      const t = translations[currentLang];
      if (!isCameraActive && !isSwitchingCamera) {
        document.getElementById('gesture-text').innerText = t.statusWaiting;
      } else if (isSwitchingCamera) {
        document.getElementById('gesture-text').innerText = t.statusSwitchingCam;
      } else {
        updateGestureUI(currentGesture);
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();
      const faceRegion = { minX: -2.0, maxX: 2.0, minY: 0.2, maxY: 2.8 };

      butterflies.forEach((b, idx) => {
        const userData = b.userData;

        // Wing Flapping Speed
        let flapRate = userData.flapSpeed;
        if (userData.isPerched) flapRate *= 0.25;

        const wingAngle = Math.sin(time * flapRate + userData.flapPhase) * 0.75;
        userData.leftWing.rotation.y = wingAngle;
        userData.rightWing.rotation.y = -wingAngle;

        // --- Interaction Behaviors ---
        if (userData.isPerched && currentGesture === 'PALM_OPEN') {
          const targetPalmPos = handCenterPos.clone().add(userData.palmOffset);
          b.position.lerp(targetPalmPos, 0.12);
          b.rotation.z = Math.sin(time * 2 + idx) * 0.08;
          b.rotation.x = 0.15;
        } 
        else if (userData.isPerched && currentGesture === 'POINTING' && b === landedFingerButterfly) {
          b.position.lerp(targetFingerPos, 0.12);
          b.rotation.z = Math.sin(time * 2) * 0.1;
          b.rotation.x = 0.2;
        } 
        else {
          let target = new THREE.Vector3();

          if (currentGesture === 'FIST' && handLandmarks) {
            const orbitAngle = time * 0.8 + idx * (Math.PI * 2 / butterflies.length);
            const radius = 2.2 + Math.sin(time + idx) * 0.6;

            target.set(
              handCenterPos.x + Math.cos(orbitAngle) * radius,
              handCenterPos.y + Math.sin(orbitAngle) * radius * 0.7,
              handCenterPos.z + Math.sin(orbitAngle * 1.5) * 1.2
            );
          } else {
            const offset = userData.wanderOffset;
            target.set(
              Math.sin(time * 0.4 + offset.x) * 6.5,
              Math.cos(time * 0.3 + offset.y) * 4.0,
              Math.sin(time * 0.5 + offset.z) * 3.0
            );

            // Avoid Face Overlay
            if (target.x > faceRegion.minX && target.x < faceRegion.maxX &&
                target.y > faceRegion.minY && target.y < faceRegion.maxY) {
              target.y += 2.0;
            }
          }

          const steer = new THREE.Vector3().subVectors(target, b.position).multiplyScalar(0.015);
          userData.velocity.add(steer);
          userData.velocity.clampLength(0, 0.08);
          b.position.add(userData.velocity);

          if (userData.velocity.lengthSq() > 0.00001) {
            const heading = b.position.clone().add(userData.velocity);
            b.lookAt(heading);
            b.rotateY(Math.PI / 2);
          }
        }
      });

      renderer.render(scene, threeCamera);
    }

    window.onload = () => {
      // 1. Detect and set initial language
      const initialLang = detectDefaultLanguage();
      applyLanguage(initialLang);

      // 2. Initialize Three.js WebGL canvas
      initThreeScene();

      // 3. Register Language Toggle
      document.getElementById('btn-lang').addEventListener('click', toggleLanguage);

      // 4. Register Camera Switch Button
      document.getElementById('btn-camera').addEventListener('click', toggleCameraFacing);

      // 5. Register Start Camera Permission Button
      document.getElementById('btn-start').addEventListener('click', () => {
        initAudio();
        startCameraStream(currentFacingMode);
      });

      // 6. Audio Toggle
      document.getElementById('btn-audio').addEventListener('click', () => {
        isAudioMuted = !isAudioMuted;
        const icon = document.getElementById('audio-icon');
        if (isAudioMuted) {
          icon.className = 'fas fa-volume-mute text-red-400';
        } else {
          icon.className = 'fas fa-volume-up';
          initAudio();
        }
      });

      // 7. Help Modal Toggle
      const helpModal = document.getElementById('help-modal');
      document.getElementById('btn-help').addEventListener('click', () => {
        helpModal.classList.remove('hidden');
      });
      document.getElementById('btn-close-help').addEventListener('click', () => {
        helpModal.classList.add('hidden');
      });

      // 8. Start Rendering Loop
      animate();
    };
  </script>
</body>
</html>
